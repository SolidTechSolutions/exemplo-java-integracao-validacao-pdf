# EN:    SolidSign PAdES (PDF) signature validation example
#        Run: mvn spring-boot:run
#        Batch: POST http://localhost:8094/api/pdf/validate/batch
#        Form:  POST http://localhost:8094/api/pdf/validate/form
#
# PT-BR: Exemplo de validação de assinatura PAdES (PDF)
#        Executar: mvn spring-boot:run
#        Lote: POST http://localhost:8094/api/pdf/validate/batch
#        Form: POST http://localhost:8094/api/pdf/validate/form

server.port=8094

# SolidSign API
solidsign.api.base-url=http://localhost:8080
solidsign.api.authorization=Bearer eyJ...

# Batch mode: directory containing signed PDFs to validate
solidsign.batch.input-path=C:/signed_pdfs
# Directory where validation JSON reports will be saved
solidsign.batch.output-path=C:/validation_results

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=200MB
